<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
<title>OrchDesk · 会话优先的本地 Agent 工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="titlebar">
  <div class="logo">OD</div>
  <span class="app-name">OrchDesk</span>
  <span class="win-title" id="winTitle">会话 — 本地 Agent 工作台</span>
  <div class="tray-hint"><span class="tray-dot"></span><span id="trayText">本地运行 · 1 专家在线</span></div>
  <span style="margin-left:auto" class="row">
    <span style="color:var(--fg-faint)" id="clock"></span>
    <button class="btn ghost sm" data-action="toggle-theme">深色</button>
  </span>
</header>

<div class="app has-ctx" id="appGrid">
  <nav class="rail" id="rail"></nav>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
  <aside class="context" id="context"></aside>
</div>

<div class="statusbar">
  <span class="mut" style="color:var(--fg-dim)">会话优先 · 一切皆插件 · dsh 基线 99f6f02 · P1–P6 路线图已收口</span>
</div>

<div class="wizard hidden" id="wizard">
  <div class="wz-card">
    <div class="wz-body" id="wzBody"></div>
    <div class="wz-foot">
      <button class="btn ghost" data-action="wz-skip">跳过</button>
      <button class="btn primary" data-action="wz-next" id="wzNext">继续</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="menuRoot"></div>
<div id="toastRoot"></div>

<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
