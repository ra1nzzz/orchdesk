name: CI/CD - Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 项目用 pnpm（pnpm-lock.yaml + packageManager 字段）。
      # 历史 BUG：cache: npm 找不到 package-lock.json → CI 自 v0.8.0 起秒挂。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本读根 package.json 的 packageManager 字段，无需指定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13（v0.10.1 首跑挂在这：Node 20 下 pnpm.CMD 直接崩）
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        # --no-frozen-lockfile：本地 lockfile 曾与 desktop 依赖漂移（6 项未入库），且本机
        # pnpm fetch 受代理/safe-delete shim 干扰无法稳定重建 lockfile —— 由 CI 解析并收敛。
        run: pnpm install --no-frozen-lockfile

      # dsh 底座（references/deepseek-harness）是 gitignore 的本地 clone：
      # vendor-dsh 的 7 个 @deepseek-ai 包与插件类型解析都源自它，CI 必须自取上游并构建。
      - name: Fetch dsh base (deepseek-harness)
        shell: bash
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git references/deepseek-harness

      - name: Build dsh libs
        shell: bash
        run: |
          cd references/deepseek-harness
          pnpm install --no-frozen-lockfile
          npm run build:lib

      # 插件 tsc 需要解析 @deepseek-ai/{cordis,schemastery,dsh-agent,dsh-session}；
      # 与 vendor-dsh 同源（上游 vendor/ + 构建产物）物化到根 node_modules。
      - name: Materialize dsh modules for typecheck
        shell: bash
        run: |
          node -e "
          const fs=require('fs'),path=require('path');
          function cp(src,dst){fs.mkdirSync(dst,{recursive:true});for(const e of fs.readdirSync(src,{withFileTypes:true})){if(['node_modules','src','tests'].includes(e.name))continue;const s=path.join(src,e.name),d=path.join(dst,e.name);if(e.isDirectory())cp(s,d);else fs.copyFileSync(s,d);}}
          const DSH='references/deepseek-harness';
          const map={'vendor/cordis':'cordis','vendor/schemastery':'schemastery','packages/core/agent':'dsh-agent','packages/core/session':'dsh-session'};
          for(const [src,dst] of Object.entries(map))cp(path.join(DSH,src),path.join('node_modules','@deepseek-ai',dst));
          console.log('materialized',Object.keys(map).length,'dsh modules');
          "

      # lib/ 被 gitignore，CI 必须自建 9 个插件产物（vendor-dsh 只搬运不编译）。
      - name: Build plugin libraries
        shell: bash
        run: |
          for d in packages/plugin/*/; do
            echo "== $d"
            (cd "$d" && npx tsc -p tsconfig.json)
          done

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG="v$(node -e "console.log(require('./apps/desktop/package.json').version)")"
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Bump version in package.json
        shell: bash
        run: |
          cd apps/desktop
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      # BUG-W04：conventional-changelog 链路坏（git-raw-commits 无 -hash- 分隔符 → 全历史被吞）。
      # 用零依赖自研脚本；--from 取 HEAD 前最近 tag（HEAD 本身就是本次 tag，默认取会得到空区间）。
      - name: Update CHANGELOG.md
        shell: bash
        run: |
          FROM_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$FROM_TAG" ]; then
            node scripts/changelog.mjs --from "$FROM_TAG" --version "${{ steps.version.outputs.version }}" --write
          else
            echo "（无更早 tag，跳过 changelog 生成）"
          fi

      - name: Build Electron (TypeScript)
        run: |
          cd apps/desktop
          npx tsc -p tsconfig.json

      # 物化 dsh 包 + 插件产物进 apps/desktop（asar 可解析的实路径），必须在 electron-builder 前跑。
      - name: Vendor dsh runtime & plugins
        run: |
          cd apps/desktop
          node scripts/vendor-dsh.cjs

      # electron-builder 认 GH_TOKEN（不认 GITHUB_TOKEN）。
      # TRACE TOKEN 不进 CI：无内置文件时应用安全降级为「只缓冲不上传」。
      - name: Package (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          npx electron-builder --win nsis portable --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: apps/desktop/release/*
          retention-days: 30

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          cd apps/desktop
          if [ -f CHANGELOG.md ]; then
            HEADER="## [Unreleased]\n\n"
            NOTES=$(sed -n "/## \[${{ steps.version.outputs.version }}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -z "$NOTES" ]; then
              NOTES="Version ${{ steps.version.outputs.version }}"
            fi
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          echo "notes=Version ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
