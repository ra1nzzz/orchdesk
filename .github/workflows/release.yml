name: CI/CD - Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          cd apps/desktop
          npm install

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Bump version in package.json
        run: |
          cd apps/desktop
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      - name: Update CHANGELOG.md
        shell: bash
        run: |
          cd apps/desktop
          npx conventional-changelog -p angular -i CHANGELOG.md -s || true

      - name: Build Electron (TypeScript)
        run: |
          cd apps/desktop
          npx tsc -p tsconfig.json

      - name: Package (electron-builder)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          npx electron-builder --win nsis portable --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: apps/desktop/release/*
          retention-days: 30

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          cd apps/desktop
          if [ -f CHANGELOG.md ]; then
            HEADER="## [Unreleased]\n\n"
            NOTES=$(sed -n "/## \[${{ steps.version.outputs.version }}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -z "$NOTES" ]; then
              NOTES="Version ${{ steps.version.outputs.version }}"
            fi
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          echo "notes=Version ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
