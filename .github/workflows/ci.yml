name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR/分支的新 push 取消进行中的旧 run，避免排队空耗。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 项目用 pnpm（pnpm-lock.yaml + packageManager 字段）。
      # 历史 BUG：cache: npm 找不到 package-lock.json → CI 自 v0.8.0 起秒挂。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本读根 package.json 的 packageManager 字段，无需指定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13（v0.10.1 首跑挂在这：Node 20 下 pnpm.CMD 直接崩）
          node-version: '22'
          cache: 'pnpm'

      # 顺序很关键：dsh 底座必须先 clone + build，根 install 才能看到完整 workspace。
      # pnpm-workspace.yaml 的 globs 含 references/deepseek-harness/{vendor,packages}/*/*
      # ——clone 之前根 install，这些 globs 匹配不到任何包，根 node_modules 里就没有
      # @deepseek-ai/cordis 及其依赖（cosmokit 等），后面 Verify 一执行就
      # ERR_MODULE_NOT_FOUND。本地从不在这一步翻车，是因为本地根 node_modules 是一次
      # 完整 install 的产物（cordis / cosmokit 都是真目录），物化步骤在本地从未跑过。
      # dsh 底座（references/deepseek-harness）是 gitignore 的本地 clone：
      # vendor-dsh 的 7 个 @deepseek-ai 包与插件类型解析都源自它，CI 必须自取上游并构建。
      # commit 来自仓库根 dsh.lock，与 cordis.patch.yml 基线一致。禁止 clone 默认分支 tip。
      - name: Fetch dsh base (deepseek-harness)
        shell: bash
        run: |
          COMMIT=$(tr -d '[:space:]' < dsh.lock)
          mkdir -p references
          git init references/deepseek-harness
          cd references/deepseek-harness
          git remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          # GitHub 不允许 want 一个不是 ref tip 的 SHA（uploadpack.allowAnySHA1InWant 未开），
          # 所以 `git fetch origin $COMMIT` 恒报 couldn't find remote ref——main 上连续 11 次
          # CI 红在这一步，与任何业务改动无关。改为按 tag 取（该 commit 正是 tag
          # dsh-v0.1.3-alpha.1 的 tip），取完必须校验等于 dsh.lock：上游若移动 tag 或 lock 变更，
          # 要立刻失败，而不是静默构建另一套基线。
          git fetch --depth 1 origin refs/tags/dsh-v0.1.3-alpha.1
          git checkout --force FETCH_HEAD
          # dsh.lock 存的是短 SHA，rev-parse 给全量 → 用前缀匹配（真实漂移仍会失败）
          GOT=$(git rev-parse HEAD)
          case "$GOT" in
            "$COMMIT"*) echo "dsh 基线一致：$GOT" ;;
            *) echo "::error::dsh 基线漂移：dsh.lock=$COMMIT，tag dsh-v0.1.3-alpha.1=$GOT。请更新 dsh.lock 或改成本次真正要用的 ref。"; exit 1 ;;
          esac
          cd ../..

      - name: Build dsh libs
        shell: bash
        run: |
          cd references/deepseek-harness
          pnpm install --no-frozen-lockfile
          npm run build:lib

      # --frozen-lockfile：OrchDesk 自己的 pnpm-lock.yaml 是源，禁止 CI 解析漂移。
      # 此时 dsh 已在位，workspace globs 能匹配到它的包，锁文件与之同步（本地已验证）。
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 插件 tsc 需要解析 @deepseek-ai/{cordis,schemastery,dsh-agent,dsh-session}；
      # Verify 还要真正执行 cordis → 必须连它的运行期依赖 cosmokit 一起物化
      # （cordis/lib/index.js 只 import cosmokit，cosmokit 自身无外部 import，
      # 所以这 5 个包就够了）。这些包在插件 package.json 里是 peerDependencies，
      # 而 pnpm-workspace.yaml 设了 autoInstallPeers: false —— 根 install 不会链接它们，
      # 本地根 node_modules 里那份是历史上物化/安装留下的，CI 必须自建。
      - name: Materialize dsh modules (typecheck + runtime)
        shell: bash
        run: |
          node -e "
          const fs=require('fs'),path=require('path');
          function cp(src,dst){fs.mkdirSync(dst,{recursive:true});for(const e of fs.readdirSync(src,{withFileTypes:true})){if(['node_modules','src','tests'].includes(e.name))continue;const s=path.join(src,e.name),d=path.join(dst,e.name);if(e.isDirectory())cp(s,d);else fs.copyFileSync(s,d);}}
          const DSH='references/deepseek-harness';
          const map={'vendor/cordis':'cordis','vendor/cosmokit':'cosmokit','vendor/schemastery':'schemastery','packages/core/agent':'dsh-agent','packages/core/session':'dsh-session'};
          for(const [src,dst] of Object.entries(map))cp(path.join(DSH,src),path.join('node_modules','@deepseek-ai',dst));
          console.log('materialized',Object.keys(map).length,'dsh modules (含 cosmokit 运行期依赖)');
          "

      # lib/ 被 gitignore，CI 必须自建 9 个插件产物（vendor-dsh 只搬运不编译）。
      - name: Build plugin libraries
        shell: bash
        run: |
          for d in packages/plugin/*/; do
            echo "== $d"
            (cd "$d" && npx tsc -p tsconfig.json)
          done

      - name: Build Electron (Typecheck)
        run: |
          cd apps/desktop
          npx tsc -p tsconfig.json

      # 物化 dsh 包 + 插件产物进 apps/desktop：vendor/ 被 gitignore，CI 必须自建，
      # 否则 arch-guard R6（vendor 产物链路断言）FAIL，verify 链断。
      # 顺序镜像 release.yml（已验证）：Build dsh libs → Build plugin libraries → Vendor。
      - name: Vendor dsh runtime & plugins
        shell: bash
        run: |
          cd apps/desktop
          node scripts/vendor-dsh.cjs

      # e2e-fix-verify 需要本机 Chromium。
      - name: Install Playwright Chromium
        run: |
          cd apps/desktop
          npx playwright install chromium

      - name: Verify
        run: pnpm --filter @orchdesk/desktop run verify
