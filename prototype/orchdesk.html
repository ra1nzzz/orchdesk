<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrchDesk · 会话优先的本地 Agent 工作台（原型 v0.6）</title>
<style>
:root{
  --bg:#FFFFFF; --bg-panel:#F5F5F4; --bg-hover:#ECECEA; --bg-inset:#FAFAF9;
  --fg:#1F2937; --fg-dim:#6B7280; --fg-faint:#9CA3AF;
  --border:#E5E4E2; --border-strong:#D6D5D2;
  --accent:#2563EB; --accent-soft:#DBEAFE; --accent-fg:#1D4ED8;
  --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --ceo:#7C3AED; --ceo-soft:#EDE9FE; --director:#2563EB; --worker:#6B7280;
  --shadow:0 8px 28px rgba(0,0,0,.14); --radius:8px;
}
[data-theme="dark"]{
  --bg:#1E1E1E; --bg-panel:#252526; --bg-hover:#2E2E30; --bg-inset:#232324;
  --fg:#E5E7EB; --fg-dim:#9CA3AF; --fg-faint:#6B7280;
  --border:#3A3A3C; --border-strong:#4A4A4D;
  --accent:#3B82F6; --accent-soft:#1E3A5F; --accent-fg:#93C5FD;
  --ok:#22C55E; --ok-soft:#14532D; --warn:#F59E0B; --warn-soft:#4A3512;
  --danger:#EF4444; --danger-soft:#5A1D1D;
  --ceo:#A78BFA; --ceo-soft:#3B2A63; --director:#60A5FA; --worker:#9CA3AF;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:#525252;color:var(--fg);overflow:hidden;display:flex;align-items:center;justify-content:center}
code,pre,.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.frame{width:min(1400px,98vw);height:min(900px,96vh);background:var(--bg);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border-strong)}
.titlebar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg-panel);border-bottom:1px solid var(--border);user-select:none}
.titlebar .logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--ceo),var(--accent));display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.titlebar .app-name{font-weight:600}
.titlebar .win-title{color:var(--fg-dim);font-size:12px}
.titlebar .tray-hint{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--fg-dim);font-size:11px;background:var(--bg-inset);border:1px solid var(--border);border-radius:20px;padding:2px 10px}
.titlebar .tray-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.win-controls{display:flex;gap:2px;margin-left:8px}
.win-controls button{width:34px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--fg-dim)}
.win-controls button:hover{background:var(--bg-hover)}
.win-controls button.close:hover{background:var(--danger);color:#fff}

.app{flex:1;display:grid;grid-template-columns:60px 270px 1fr;min-height:0}
.app.has-ctx{grid-template-columns:60px 270px 1fr 300px}
.rail{background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.rail .sp{flex:1}
.navbtn{position:relative;width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-dim)}
.navbtn svg{width:20px;height:20px}
.navbtn .nl{font-size:9.5px;transform:scale(.94)}
.navbtn:hover{background:var(--bg-hover);color:var(--fg)}
.navbtn.active{background:var(--accent-soft);color:var(--accent-fg)}
.navbtn .badge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px;font-weight:600}

.side{background:var(--bg-inset);border-right:1px solid var(--border);overflow-y:auto;padding:10px 8px 80px;position:relative}
.main{overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
.context{background:var(--bg-panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px;display:none}
.app.has-ctx .context{display:block}

/* ========== 会话侧栏：项目分组 + 会话 ========== */
.proj{padding:2px 2px 4px}
.proj+.proj{margin-top:6px}
.proj-head{position:relative;display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer}
.proj-head:hover{background:var(--bg-hover)}
.proj-head .pf{width:14px;height:14px;display:grid;place-items:center;color:var(--fg-faint);transition:.15s}
.proj-head .pf.open{transform:rotate(90deg)}
.proj-head .pn{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--fg-dim);text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-head .pc{font-size:10px;color:var(--fg-faint);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:0 5px;min-width:18px;text-align:center}
.proj-head .pm{opacity:0;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg-faint)}
.proj-head:hover .pm{opacity:1}
.proj-head .pm:hover{background:var(--bg);color:var(--fg)}
.proj-list{padding:2px 0 0 20px}
.sess{position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;margin-top:1px}
.sess:hover{background:var(--bg-hover)}
.sess.active{background:var(--accent-soft)}
.sess.active .sn{color:var(--accent-fg)}
.sess .si{width:6px;height:6px;border-radius:50%;background:var(--fg-faint);flex:none}
.sess.active .si{background:var(--accent)}
.sess .sn{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .sm{opacity:0;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg-faint);flex:none}
.sess:hover .sm,.sess.active .sm{opacity:1}
.sess .sm:hover{background:var(--bg);color:var(--fg)}
.sess .st{font-size:10.5px;color:var(--fg-faint);margin-right:2px}
.sess.active .st{color:var(--accent-fg)}

/* 悬浮 + 新建按钮（气泡包裹的 + 号） */
.fab-wrap{position:absolute;left:0;right:0;bottom:14px;display:grid;place-items:center;pointer-events:none}
.fab{pointer-events:auto;position:relative;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(37,99,235,.4),0 0 0 1px rgba(255,255,255,.08) inset;display:grid;place-items:center;transition:.18s}
.fab:hover{transform:scale(1.08)}
.fab svg{width:20px;height:20px}
.fab::before{content:"新建会话";position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--fg);color:var(--bg);font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s}
.fab::after{content:"";position:absolute;left:calc(100% + 4px);top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:var(--fg);opacity:0;pointer-events:none;transition:.18s}
.fab:hover::before,.fab:hover::after{opacity:1}

/* 弹出菜单 */
.pop{position:absolute;z-index:50;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);min-width:170px;padding:4px;animation:pop .15s ease}
.pop .mi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--fg)}
.pop .mi:hover{background:var(--bg-hover)}
.pop .mi svg{width:14px;height:14px;color:var(--fg-dim)}
.pop .mi.danger{color:var(--danger)}
.pop .mi.danger svg{color:var(--danger)}
.pop .mi.sep{border-top:1px solid var(--border);margin-top:4px;padding-top:7px}

/* ========== 主区通用 ========== */
.sec-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--fg-faint);text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sec-title:first-child{margin-top:0}
.sec-title .ico{width:14px;height:14px;display:grid;place-items:center;color:var(--fg-dim)}
h1.pg{font-size:17px;font-weight:700;margin-bottom:2px}
.pg-sub{color:var(--fg-dim);font-size:12px;margin-bottom:16px}

.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid var(--border-strong);background:var(--bg);font-size:12px;color:var(--fg)}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;color:var(--accent-fg)}
.btn.sm{padding:3px 9px;font-size:11px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:600;background:var(--bg-hover);color:var(--fg-dim)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)} .badge.info{background:var(--accent-soft);color:var(--accent-fg)}
.badge.ceo{background:var(--ceo-soft);color:var(--ceo)}
.badge.cap{background:transparent;border:1px solid var(--border-strong);color:var(--fg-dim);font-weight:500}
.badge.cap.danger{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.badge.cap.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.gauge{height:8px;background:var(--bg-hover);border-radius:4px;overflow:hidden;position:relative}
.gauge>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.gauge>i.warn{background:var(--warn)} .gauge>i.ok{background:var(--ok)}
.gauge .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:11px;background:var(--bg)}
.switch{position:relative;width:34px;height:19px;border-radius:10px;background:var(--border-strong);transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--ok)} .switch.on::after{left:17px}
input[type=text],input[type=search],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:12.5px}
input[type=search]{padding-left:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>");background-repeat:no-repeat;background-position:9px center;background-size:14px}

/* 会话消息 */
.msg{display:flex;gap:11px;padding:12px 14px;max-width:760px}
.msg.user .avatar{background:var(--accent)}
.msg.agent .avatar{background:var(--ceo)}
.avatar{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.msg .body{flex:1;min-width:0}
.msg .meta{font-size:11px;color:var(--fg-faint);margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg.user{background:var(--bg-inset)}
.msg.agent{background:var(--bg)}
.tools{margin-top:7px}
.tools summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--fg-dim);display:flex;gap:6px;align-items:center}
.tools summary::-webkit-details-marker{display:none}
.tools .trow{font-size:11.5px;color:var(--fg-dim);padding:3px 0 3px 8px;border-left:2px solid var(--border-strong);margin:2px 0 2px 4px;display:flex;gap:8px;align-items:center}
.subagent{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-dim);background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-top:7px}
.subagent .phases{display:flex;align-items:center;gap:5px}
.feedback{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-faint)}
.feedback button{padding:2px 10px;border:1px solid var(--border-strong);border-radius:6px;font-size:11px}
.feedback button:hover{background:var(--bg-hover)}
.confirm-banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:9px 12px;margin-top:8px;font-size:12px}

/* composer */
.composer{flex:none;border-top:1px solid var(--border);padding:10px 16px 12px;background:var(--bg-panel)}
.composer .box{border:1px solid var(--border-strong);border-radius:10px;background:var(--bg);padding:8px 10px;max-width:760px;margin:0 auto;transition:.15s}
.composer .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{width:100%;border:none;resize:none;background:transparent;outline:none;font-size:13px;min-height:36px;line-height:1.5}
.composer .bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.composer .tools-left{display:flex;align-items:center;gap:2px}
.composer .t-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--fg-dim);position:relative;transition:.15s}
.composer .t-btn:hover{background:var(--bg-hover);color:var(--fg)}
.composer .t-btn svg{width:16px;height:16px}
.composer .t-btn::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:10.5px;padding:3px 7px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.composer .t-btn::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--fg);opacity:0;pointer-events:none;transition:.15s}
.composer .t-btn:hover::after,.composer .t-btn:hover::before{opacity:1}
.composer .auth{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:11.5px;background:var(--bg);color:var(--fg-dim);cursor:pointer;transition:.15s}
.composer .auth:hover{border-color:var(--accent);color:var(--accent-fg)}
.composer .auth .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.composer .auth.full{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.composer .auth.full .dot{background:var(--warn);animation:pulse 1.6s infinite}
.composer .right{display:flex;align-items:center;gap:8px}
.composer .intent-hint{font-size:11px;color:var(--fg-faint);display:flex;align-items:center;gap:5px}

/* 插件卡片 */
.plug{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:14px;transition:.15s}
.plug+.plug{margin-top:10px}
.plug:hover{border-color:var(--border-strong)}
.plug .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.plug .ptitle{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plug .pdesc{color:var(--fg-dim);font-size:12.5px;margin-top:4px;line-height:1.55}
.plug .pmeta{color:var(--fg-faint);font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plug .pmeta .mono{font-size:11px}
.plug .pcaps{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.plug .pactions{display:flex;align-items:center;gap:8px;flex:none}
.plug .pbody{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:none}
.plug.open .pbody{display:block}

/* 设置 - 状态条 */
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.stat .sk{font-size:10.5px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em}
.stat .sv{font-size:14px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}

/* 设置 - 模型搜索 */
.models-search{margin-bottom:10px}
.models-card{padding:0;overflow:hidden}
.models-card table{border-collapse:collapse;width:100%}
.models-card th{text-align:left;color:var(--fg-faint);font-weight:600;font-size:11px;padding:8px 12px;border-bottom:1px solid var(--border-strong);background:var(--bg-inset)}
.models-card td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.models-card tr:last-child td{border-bottom:none}

/* 设置 - 桌面集成网格 */
.desktop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.desktop-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.desktop-item .di-name{font-size:12.5px;font-weight:600}
.desktop-item .di-desc{font-size:11px;color:var(--fg-faint);margin-top:1px}

/* 向导 */
.wizard{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(20,20,25,.5);backdrop-filter:blur(3px)}
.wizard.hidden{display:none}
.wz-card{width:min(560px,94vw);background:var(--bg);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.wz-body{padding:24px 26px}
.wz-foot{padding:14px 26px;border-top:1px solid var(--border);display:flex;justify-content:space-between;background:var(--bg-panel)}
.expert-opt{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--bg-panel);display:flex;gap:10px;align-items:center}
.expert-opt:hover{border-color:var(--accent)}
.expert-opt.sel{border-color:var(--accent);background:var(--accent-soft)}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.45);display:grid;place-items:center;z-index:60;backdrop-filter:blur(2px)}
.modal{width:min(540px,92vw);background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal.danger{border-color:var(--danger)}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal .mh.danger{background:var(--danger-soft);color:var(--danger)}
.modal .mh svg{width:18px;height:18px}
.modal .mb{padding:16px;font-size:13px;line-height:1.6}
.modal .mb .warn-list{background:var(--bg-inset);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-top:8px;font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;color:var(--fg-dim)}
.modal .mb .warn-list div{padding:2px 0}
.modal .mf{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--bg-panel)}
#toastRoot{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);animation:pop .2s ease}
.toast.ok{background:var(--ok);color:#fff} .toast.warn{background:var(--warn);color:#fff} .toast.danger{background:var(--danger);color:#fff}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th{text-align:left;color:var(--fg-faint);font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border-strong)}
table.tb td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* 通用：图标按钮 */
.iconbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg-dim);transition:.15s}
.iconbtn:hover{background:var(--bg-hover);color:var(--fg)}
.iconbtn svg{width:15px;height:15px}

/* 主区内容内边距（插件/设置） */
.main-inner{padding:20px 28px 28px;max-width:960px;margin:0 auto;width:100%}

/* 插件侧栏可折叠分组 */
.ssec{padding:2px 2px 4px}
.ssec+.ssec{margin-top:6px}
.ssec .ss-h{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer}
.ssec .ss-h:hover{background:var(--bg-hover)}
.ssec .ss-c{width:14px;height:14px;display:grid;place-items:center;color:var(--fg-faint);transition:.15s;flex:none}
.ssec .ss-c.open{transform:rotate(90deg)}
.ssec .ss-t{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--fg-dim);text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ssec .ss-n{font-size:10px;color:var(--fg-faint);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:0 5px;min-width:18px;text-align:center;flex:none}
.ssec .ss-l{padding:2px 0 0 20px}
.ssec .ss-i{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;margin-top:1px}
.ssec .ss-i:hover{background:var(--bg-hover)}
.ssec .ss-i .id{width:6px;height:6px;border-radius:50%;background:var(--fg-faint);flex:none}
.ssec .ss-i.on .id{background:var(--ok)}
.ssec .ss-i .in{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.ssec .ss-i .ib{font-size:9.5px;flex:none}

/* composer 模型/思维选择器 */
.c-mp{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:11.5px;background:var(--bg);color:var(--fg-dim);cursor:pointer;transition:.15s;max-width:220px}
.c-mp:hover{border-color:var(--accent);color:var(--accent-fg)}
.c-mp .md{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.c-mp .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-mp.multi{border-color:var(--ceo);color:var(--ceo)}
.c-mp.multi .md{background:var(--ceo)}
.c-mp svg{width:12px;height:12px;flex:none}
.think-slider{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:11.5px;background:var(--bg);color:var(--fg-dim)}
.think-slider input[type=range]{width:90px;height:4px;-webkit-appearance:none;background:var(--bg-hover);border-radius:2px;outline:none;cursor:pointer}
.think-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.think-slider input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1)}
.think-slider .tl{color:var(--accent-fg);font-weight:600;min-width:32px;text-align:right}

/* 模型选择 modal */
.mg-grp{margin-bottom:14px}
.mg-grp .mg-h{font-size:11px;font-weight:700;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.mg-grp .mg-h .mg-all{font-size:10.5px;color:var(--accent-fg);cursor:pointer;font-weight:500;text-transform:none;letter-spacing:0;margin-left:auto}
.m-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:5px;cursor:pointer;transition:.15s}
.m-opt:hover{border-color:var(--accent)}
.m-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.m-opt .mo-cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center;transition:.15s}
.m-opt.sel .mo-cb{background:var(--accent);border-color:var(--accent)}
.m-opt.sel .mo-cb::after{content:"";width:8px;height:5px;border:2px solid #fff;border-top:none;border-right:none;transform:rotate(-45deg) translate(1px,-1px)}
.m-opt .mo-info{flex:1;min-width:0}
.m-opt .mo-name{font-size:12.5px;font-weight:600}
.m-opt .mo-meta{font-size:11px;color:var(--fg-faint)}
.m-opt .mo-state{font-size:10.5px;flex:none}

/* 思维等级 */
.tk-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tk-opt{border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:center;transition:.15s}
.tk-opt:hover{border-color:var(--accent)}
.tk-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tk-opt .to-n{font-size:12.5px;font-weight:600}
.tk-opt .to-d{font-size:10.5px;color:var(--fg-faint);margin-top:2px}
</style>

function renderMsg(m,sid){

 const tools=(m.tools&&m.tools.length)?`<details class="tools"><summary>${ic('chev',14)} ${m.steps} 步 · ${m.tools.length} 个动作</summary>${m.tools.map(t=>`<div class="trow"><span class="dot" style="background:${t.ph==='running'?'var(--warn)':'var(--ok)'};${t.ph==='running'?'animation:pulse 1.6s infinite':''}"></span><span class="mono">${t.n}</span><span class="faint" style="margin-left:auto">${t.ph==='running'?'执行中':'完成'}</span></div>`).join('')}</details>`:'';
 const sub=m.sub?`<div class="subagent"><span class="badge ${m.sub.state==='running'?'warn':'info'}">SubAgent</span><span class="mono">${m.sub.name}</span><span class="phases faint">${m.sub.state==='running'?'执行中 · 即用即走':'已回收并销毁'}</span></div>`:'';
 const fb=(m.feedback && state.feedback.has(sid+'|'+m.t))?`<div class="feedback" style="color:var(--ok)">已记录反馈 · 已脱敏遥测</div>`
  : (m.feedback?`<div class="feedback"><span>这条回答对你有帮助吗？</span><button data-action="trace" data-t="${m.t}">有帮助</button><button data-action="trace" data-t="${m.t}">需改进</button><span class="faint">TRACE 脱敏遥测 → 公开 GitHub 仓库</span></div>`:'');
 return `<div class="msg ${isU?'user':'agent'}">
  <div class="avatar">${isU?'我':'AI'}</div>
  <div class="body"><div class="meta"><b>${isU?'你':'OrchDesk'}</b><span>${m.t}</span>${intentBadge}</div>
  <div>${m.x}</div>${sub}${tools}${fb}</div></div>`;
}

function openMenu(anchor,items){
 $('#menuRoot').innerHTML='';
 const r=anchor.getBoundingClientRect();
 const pop=document.createElement('div');
 pop.className='pop';
 pop.style.top=(r.bottom+4)+'px';
 pop.style.left=(r.right-180)+'px';
 pop.innerHTML=items.map(it=>it.sep?`<div class="mi sep" data-action="menu-item" data-id="${it.id||''}">${it.svg?`<span>${it.svg}</span>`:''}<span>${it.label}</span></div>`:`<div class="mi ${it.danger?'danger':''}" data-action="menu-item" data-id="${it.id||''}">${it.svg?`<span>${it.svg}</span>`:''}<span>${it.label}</span></div>`).join('');
 $('#menuRoot').appendChild(pop);
 setTimeout(()=>{document.addEventListener('click',function close(ev){if(!ev.target.closest('.pop')){$('#menuRoot').innerHTML='';document.removeEventListener('click',close)}},{once:true})},0);
}

  </div>
  <div class="mf">
   <button class="btn ghost" data-action="modal-cancel">取消</button>
   <button class="btn primary" data-action="rename-confirm" data-id="${sid}">保存</button>
  </div>`);
}

function confirmArchiveProject(pid){
 const p=PROJECTS.find(x=>x.id===pid);
 openModal(`<div class="mh danger">${ic('archive',18)}<b>归档项目「${p.n}」？</b></div>
  <div class="mb">
   <div>归档后将折叠到「已归档」分组，<b>不可在前台直接打开</b>。所有会话日志和事件仍保留在数据目录，可随时还原。</div>
   <div class="warn-list"><div>· 项目内 <b>${p.sessions.length}</b> 个会话一并归档</div><div>· 插件与配置保留</div><div>· 归档后可在「已归档」组中点击 <b>···还原</b></div></div>
  </div>
  <div class="mf">
   <button class="btn ghost" data-action="modal-cancel">取消</button>
   <button class="btn danger" data-action="archive-confirm" data-id="${pid}">确认归档</button>
  </div>`);
}

function openProjectDir(pid){
 const p=PROJECTS.find(x=>x.id===pid);
 toast(`已打开项目目录：${p.n}/（演示）`,'ok');
}

/* 加载技能 / 引用专家团 */
function openSkillPicker(){
 const skills=PLUGINS.map(p=>p).concat(SKILLS_MARKET);
 openModal(`<div class="mh">${ic('plus',18)}<b>加载技能到当前会话</b></div>
  <div class="mb">
   <div class="faint" style="margin-bottom:8px">技能加载后将注册为本次会话的 effect，离开会话即卸载。</div>
   ${skills.map(p=>`<div class="row" style="padding:7px 8px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px"><div style="flex:1"><b>${p.n||p.d}</b><div class="faint" style="font-size:11px">${p.d||''}</div></div><button class="btn sm primary" data-action="skill-attach" data-n="${p.n||p.d}">加载</button></div>`).join('')}
  </div>
  <div class="mf"><button class="btn ghost" data-action="modal-cancel">关闭</button></div>`);
}

function openExpertPicker(){
 openModal(`<div class="mh">${ic('at',18)}<b>引用专家或专家团</b></div>
  <div class="mb">
   <div class="faint" style="margin-bottom:8px">@ 引用后，专家将以 <b>SubAgent</b> 形式参与本次回复，不替换主会话。</div>
   <div class="sec-title" style="margin:6px 0">专家</div>
   ${EXPERTS.map(e=>`<div class="row" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px;margin-bottom:5px"><div style="flex:1"><b>${e}</b></div><button class="btn sm" data-action="expert-attach" data-n="${e}">@ 引用</button></div>`).join('')}
   <div class="sec-title" style="margin:10px 0 6px">专家团</div>
   ${TEAMS.map(t=>`<div class="row" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px;margin-bottom:5px"><div style="flex:1"><b>${t.n}</b><div class="faint" style="font-size:11px">${t.m}</div></div><button class="btn sm primary" data-action="expert-attach" data-n="${t.n}">引用团</button></div>`).join('')}
  </div>
  <div class="mf"><button class="btn ghost" data-action="modal-cancel">关闭</button></div>`);
}

/* 模型选择器 */
function openModelPicker(){
 const groups={};
 MODELS.forEach(m=>{const p=m.p.split(' · ')[0];if(!groups[p])groups[p]=[];groups[p].push(m)});
 const html=Object.entries(groups).map(([provider,models])=>{
  const allSel=models.every(m=>state.selectedModels.includes(m.n));
  return `<div class="mg-grp">
   <div class="mg-h">${provider}<span class="mg-all" data-action="mg-toggle-all" data-p="${provider}">${allSel?'取消全选':'全选'}</span></div>
   ${models.map(m=>{const sel=state.selectedModels.includes(m.n);
    return `<div class="m-opt ${sel?'sel':''}" data-action="model-toggle" data-n="${m.n}">
     <div class="mo-cb"></div>
     <div class="mo-info"><div class="mo-name">${m.n}</div><div class="mo-meta">${m.p}</div></div>
     <div class="mo-state">${m.state==='已测'||m.state==='已就绪'?'<span class="badge ok">'+m.state+'</span>':'<span class="badge">'+m.state+'</span>'}</div>
    </div>`}).join('')}
  </div>`}).join('');
 openModal(`<div class="mh">${ic('bot',18)}<b>选择模型</b></div>
  <div class="mb">
   <div class="faint" style="margin-bottom:10px">可选择一个或多个提供商的单个或多个模型；多选时按顺序调用（主模型 + 备用）。思维等级对所有选中模型生效。</div>
   ${html}
  </div>
  <div class="mf">
   <button class="btn ghost" data-action="model-clear">清空</button>
   <button class="btn primary" data-action="model-confirm">确认（${state.selectedModels.length} 个）</button>
  </div>`);
}

/* ---------- 交互 ---------- */
document.body.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const a=el.dataset.action,id=el.dataset.id;
 switch(a){
  case 'nav':state.page=id;render();break;
  case 'toggle-theme':{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;break}
  case 'toggle-ctx':state.ctxOpen=!state.ctxOpen;render();break;

  /* 会话 */
  case 'sel':state.sel=id;render();break;
  case 'newconv':toast('已新建会话（演示）','ok');break;
  case 'proj-toggle':{if(state.pExpanded.has(id))state.pExpanded.delete(id);else state.pExpanded.add(id);render();break}
  case 'proj-menu':e.stopPropagation();openMenu(el,[
   {id:'open',label:'打开项目目录',svg:ic('folder',14)},
   {sep:1,label:'归档项目',svg:ic('archive',14),danger:1,id:'archive'}]);
   document.querySelector('.pop [data-id="open"]').onclick=()=>{openProjectDir(id);$('#menuRoot').innerHTML=''};
   document.querySelector('.pop [data-id="archive"]').onclick=()=>{$('#menuRoot').innerHTML='';confirmArchiveProject(id)};
   break;
  case 'sess-menu':e.stopPropagation();openMenu(el,[
   {id:'copy',label:'复制会话 ID',svg:ic('copy',14)},
   {id:'rename',label:'重命名',svg:ic('edit',14)},
   {sep:1,id:'fork',label:'创建分支',svg:ic('fork',14)},
   {sep:1,id:'archive',label:'归档',svg:ic('archive',14),danger:1}]);
   const pop=document.querySelector('.pop');
   pop.querySelector('[data-id="copy"]').onclick=()=>{navigator.clipboard?.writeText(id).catch(()=>{});toast(`已复制 #${id}`,'ok');$('#menuRoot').innerHTML=''};
   pop.querySelector('[data-id="rename"]').onclick=()=>{$('#menuRoot').innerHTML='';confirmRename(id)};
   pop.querySelector('[data-id="fork"]').onclick=()=>{$('#menuRoot').innerHTML='';confirmNewBranch(id)};
   pop.querySelector('[data-id="archive"]').onclick=()=>{$('#menuRoot').innerHTML='';toast(`会话 #${id} 已归档（演示）`,'warn')};
   break;
  case 'fork':confirmNewBranch(state.sel);break;
  case 'branch-confirm':toast('已创建分支（演示）','ok');closeModal();break;
  case 'rename-confirm':{const inp=$('#modalRoot input[type=text]');const sid=el.dataset.id;if(inp&&sid&&SESSIONS[sid]){SESSIONS[sid].title=inp.value||SESSIONS[sid].title;render();toast(`已重命名为「${SESSIONS[sid].title}」`,'ok')}closeModal();break}

  /* composer */
  case 'send':{const c=$('#composer');if(c&&c.value.trim()){if(state.selectedModels.length===0){toast('请先选择至少一个模型','warn');break}toast(`已入 SessionEvent 日志 · ${state.selectedModels.length} 模型 · 思维 ${thinkLabel(state.thinkLevel)}`,'ok');c.value=''}else toast('输入为空（演示）','warn');break}
  case 'skill-add':openSkillPicker();break;
  case 'expert-add':openExpertPicker();break;
  case 'skill-attach':toast(`已加载技能「${el.dataset.n}」（注册为 effect，离开会话即卸载）`,'ok');closeModal();break;
  case 'expert-attach':toast(`已 @引用「${el.dataset.n}」参与本次回复（SubAgent）`,'ok');closeModal();break;
  case 'auth-upgrade':confirmUpgradeAuth();break;
  case 'auth-downgrade':{state.authMode='workspace';render();toast('已降级为「工作空间写」','ok');break}
  case 'auth-confirm-up':{state.authMode='full';closeModal();render();toast('已升级为 FULL ACCESS · 期间所有 L4 操作直接执行','warn');break}
  case 'sim-highrisk':{const z=$('#confirmZone');z.innerHTML=`<div class="confirm-banner"><span class="badge warn">意图 · 待确认</span> 该请求含「删除文件」高风险动作，本地模型判定需人工确认。
   <div class="row" style="margin-top:8px"><button class="btn sm primary" data-action="confirm-yes">确认执行</button><button class="btn sm" data-action="confirm-no">拒绝</button></div></div>`;
   z.scrollIntoView();break}
  case 'confirm-yes':case 'confirm-no':{const z=$('#confirmZone');z.innerHTML='';toast(a==='confirm-yes'?'已确认 · 入审计日志':'已拒绝 · 入审计日志',a==='confirm-yes'?'ok':'danger');break}
  case 'sim-subagent':{const sc=$('#msgScroll');const div=document.createElement('div');div.className='msg agent';div.innerHTML=`<div class="avatar" style="background:var(--ceo)">AI</div><div class="body"><div class="meta"><b>OrchDesk</b><span>刚刚</span></div><div>已派发 SubAgent 处理该任务。</div><div class="subagent"><span class="badge warn">SubAgent</span><span class="mono">W-108 临时任务</span><span class="faint">执行中…</span></div></div>`;sc.appendChild(div);sc.scrollTop=sc.scrollHeight;
   setTimeout(()=>{div.querySelector('.subagent').innerHTML=`<span class="badge info">SubAgent</span><span class="mono">W-108 临时任务</span><span class="faint">已回收并销毁（即用即走）</span>`;toast('脑手解耦：SubAgent 成果已回收，上下文已销毁','ok')},2200);break}
  case 'trace':{state.feedback.add('s1|'+el.dataset.t);render();toast('TRACE：反馈已脱敏并遥测至公开 GitHub 仓库','ok');break}

  /* 模型选择 + 思维等级 */
  case 'model-pick':openModelPicker();break;
  case 'model-toggle':{
   const n=el.dataset.n;const idx=state.selectedModels.indexOf(n);
   if(idx>=0){state.selectedModels.splice(idx,1);el.classList.remove('sel')}
   else{state.selectedModels.push(n);el.classList.add('sel')}
   const btn=document.querySelector('[data-action="model-confirm"]');if(btn)btn.textContent=`确认（${state.selectedModels.length} 个）`;
   document.querySelectorAll('.mg-all').forEach(sp=>{const p=sp.dataset.p;const grp=MODELS.filter(m=>m.p.split(' · ')[0]===p);const allSel=grp.every(m=>state.selectedModels.includes(m.n));sp.textContent=allSel?'取消全选':'全选'});
   break}
  case 'mg-toggle-all':{
   const p=el.dataset.p;const grp=MODELS.filter(m=>m.p.split(' · ')[0]===p);
   const allSel=grp.every(m=>state.selectedModels.includes(m.n));
   if(allSel){grp.forEach(m=>{const i=state.selectedModels.indexOf(m.n);if(i>=0)state.selectedModels.splice(i,1)})}
   else{grp.forEach(m=>{if(!state.selectedModels.includes(m.n))state.selectedModels.push(m.n)})}
   openModelPicker();break}
  case 'model-confirm':closeModal();render();break;
  case 'model-clear':state.selectedModels=[];openModelPicker();break;

  /* 插件 */
  case 'pside-toggle':{if(state.plugSideExpanded.has(id))state.plugSideExpanded.delete(id);else state.plugSideExpanded.add(id);render();break}
  case 'plug-toggle':{el.classList.toggle('on');toast(el.classList.contains('on')?`已启用 ${id}（注册为 effect）`:`已停用 ${id}（注册已回滚，无残留）`,el.classList.contains('on')?'ok':'warn');break}
  case 'plug-cfg':{const card=el.closest('.plug');if(card)card.classList.toggle('open');break}
  case 'plug-nav':{const card=document.querySelector(`.plug[data-pid="${id}"]`);if(card){card.classList.add('open');card.scrollIntoView({behavior:'smooth',block:'start'})}break}
  case 'plug-unload':toast('已卸载并回滚注册（无残留）','warn');break;
  case 'market':toast(`已从观雅集安装「${el.dataset.n}」（能力审查通过）`,'ok');break;
  case 'market-auth':confirmUpgradeAuth();break;

  /* 设置 */
  case 'model-test':{el.disabled=true;el.textContent='测试中…';setTimeout(()=>{el.disabled=false;el.textContent='测试';toast(`${el.dataset.n} 连通正常`,'ok')},800);break}
  case 'todo':toast('原型演示：该操作在真实版本中打开对应面板');break;

  /* modal */
  case 'modal-bg':if(e.target===el)closeModal();break;
  case 'modal-cancel':closeModal();break;
  case 'archive-confirm':{const pid=el.dataset.id;const p=PROJECTS.find(x=>x.id===pid);if(p){p.archived=1;p.open=0;state.pExpanded.delete(pid);render();toast(`项目「${p.n}」已归档`,'warn')}closeModal();break}

  /* 向导 */
  case 'wz-next':if(state.wz===0){state.wz=1;renderWizard()}else{$('#wizard').classList.add('hidden');state.page='session';render();toast(`已进入会话 · 默认专家：${EXPERTS[state.wzExpert]}`,'ok')}break;
  case 'wz-skip':$('#wizard').classList.add('hidden');state.page='session';render();break;
  case 'wz-open':state.wz=0;renderWizard();$('#wizard').classList.remove('hidden');break;
  case 'wz-expert':state.wzExpert=+el.dataset.i;renderWizard();break;
 }
});

document.body.addEventListener('input',e=>{
 if(e.target.dataset.action==='think-slider'){
  const levels=['off','standard','deep','max'];
  const labels=['关闭','标准','深度','最大'];
  const v=Math.max(0,Math.min(3,parseInt(e.target.value,10)||0));
  state.thinkLevel=levels[v];
  const tl=e.target.parentElement.querySelector('.tl');
  if(tl)tl.textContent=labels[v];
 }
});

setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);
render();renderWizard();
</script>
</body>
</html>
